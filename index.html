<style>
:root{--washi:#F6F6F3;--ink:#1A1A18;--ink2:#6B6B66;--hair:rgba(26,26,24,.16);--green:#1F4D3A;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--washi);color:var(--ink);font:400 16px/1.6 "Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px 16px}
.gate{width:min(100%,380px);display:grid;gap:16px}
.mark{width:64px;height:64px}
h1{margin:0;font:300 40px/1.05 "Noto Serif Display",Georgia,serif;letter-spacing:-.02em}
p{margin:0;color:var(--ink2)}
form{display:grid;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--hair);border-radius:6px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.keep{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
button{font:500 15px/1 "Zen Kaku Gothic New",system-ui,sans-serif;padding:12px 20px;border:0;border-radius:999px;background:var(--green);color:#fff;cursor:pointer}
#err{min-height:1.5em;color:#9B3B2E;font-size:14px}
.who{display:grid;gap:12px}
.who h2{margin:0;font:300 28px/1.1 "Noto Serif Display",Georgia,serif}
.who .pick{display:flex;gap:10px}
.who .pick button{flex:1;background:#fff;color:var(--ink);border:1px solid var(--hair);font-size:16px;padding:14px 18px}
.who .pick button:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main class="gate">
<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#C9D8DB"/><ellipse cx="29" cy="41" rx="19" ry="7" fill="#E9DFC8"/><ellipse cx="29" cy="39.5" rx="16" ry="5.5" fill="#DCE3D3"/><rect x="19" y="19" width="5" height="19" fill="#FBFAF6" stroke="#1A1A18"/><rect x="19" y="25" width="5" height="3" fill="#1F4D3A"/><path d="M18 19h7l-3.5-4z" fill="#1A1A18"/><rect x="31" y="32" width="8" height="6" fill="#FBFAF6" stroke="#1A1A18"/><path d="M30 32h10l-5-4z" fill="#1F4D3A"/></svg>
<h1>Handover Island</h1>
<p>The Handover operation as a small live island: what runs, what it did and what comes next.</p>
<form id="f">
  <label for="pw" class="sr">Password</label>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
  <div class="row"><label class="keep"><input id="keep" type="checkbox" checked> Remember on this device</label><button type="submit">Open the island</button></div>
</form>
<p id="err" role="alert"></p>
<div class="who" id="who" hidden>
  <h2>Who’s this?</h2>
  <p>The call center logs every call under your name. You can switch later.</p>
  <div class="pick"><button type="button" data-who="Dimitri">Dimitri</button><button type="button" data-who="Zach">Zach</button></div>
</div>
</main>

function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function decrypt(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
  return new TextDecoder().decode(pt);
}
function saved(){try{return localStorage.getItem(SK)||sessionStorage.getItem(SK);}catch(e){return null;}}
function keep(pw,long){try{(long?localStorage:sessionStorage).setItem(SK,pw);}catch(e){}}
function forget(){try{localStorage.removeItem(SK);sessionStorage.removeItem(SK);}catch(e){}}
function show(html){document.open();document.write(html);document.close();}
function who(){try{return localStorage.getItem(WK);}catch(e){return null;}}
// Before the island opens, ask once per device who is here, so the call center logs calls under the right name.
function askWho(html){
  if(who()==="Dimitri"||who()==="Zach")return show(html);
  document.getElementById("f").hidden=true;document.getElementById("err").textContent="";
  var w=document.getElementById("who");w.hidden=false;
  w.querySelectorAll("[data-who]").forEach(function(b){b.addEventListener("click",function(){try{localStorage.setItem(WK,b.dataset.who);}catch(e){}show(html);});});
  w.querySelector("button").focus();
}
async function open_(pw,fromStore,long){
  try{var html=await decrypt(pw);if(!fromStore)keep(pw,long);askWho(html);}
  catch(e){if(fromStore){forget();}else{document.getElementById("err").textContent="That password didn't work. Check it and try again.";}}
}
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("err").textContent="Opening…";
  open_(document.getElementById("pw").value,false,document.getElementById("keep").checked);
});
(function(){var s=saved();if(s)open_(s,true);})();
